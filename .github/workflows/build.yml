# Builds the macOS disk image and the Windows installer on GitHub-hosted
# machines.
# - Every push: the DMG and the Windows installer are attached to the run
#   as artifacts.
# - Pushes to main: if there is no release yet for the version in
#   scanner.py (__version__), one is created (tag v<version>) with both.
#   To publish a new release, bump __version__ and merge to main.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to publish releases

jobs:
  dmg:
    runs-on: macos-15
    env:
      PYTHON_VERSION: "3.12.10"
    steps:
      - uses: actions/checkout@v4

      # The python.org installer is universal2 (Apple silicon + Intel) and
      # ships Tk 8.6, so the app works on both kinds of Mac.
      - name: Install python.org Python
        run: |
          curl -fsSLo python.pkg "https://www.python.org/ftp/python/${PYTHON_VERSION}/python-${PYTHON_VERSION}-macos11.pkg"
          sudo installer -pkg python.pkg -target /
          echo "PYTHON=/Library/Frameworks/Python.framework/Versions/${PYTHON_VERSION%.*}/bin/python3" >> "$GITHUB_ENV"

      - name: Run tests
        run: $PYTHON -m unittest discover -s tests -v

      - name: Build DMG
        env:
          TARGET_ARCH: universal2
        run: ./make_dmg.sh

      - name: Check the app
        run: |
          APP="dist/IP Scanner.app"
          lipo -archs "$APP/Contents/MacOS/IP Scanner"
          codesign --verify --deep --strict "$APP"
          test -f "$APP/Contents/Resources/data/oui.txt.gz" \
            || test -f "$APP/Contents/Frameworks/data/oui.txt.gz"
          ICON=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$APP/Contents/Info.plist")
          test -f "$APP/Contents/Resources/${ICON%.icns}.icns"
          hdiutil verify dist/*.dmg

      - name: Self-test the packaged app
        timeout-minutes: 5
        run: |
          set +e
          IPSCANNER_TRACE="$PWD/trace.txt" \
            "dist/IP Scanner.app/Contents/MacOS/IP Scanner" --self-test "$PWD/self-test.txt" \
            > launch.log 2>&1 &
          pid=$!
          start=$(date +%s)
          for i in $(seq 1 90); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          echo "first launch: $(( $(date +%s) - start )) s"
          if kill -0 $pid 2>/dev/null; then
            echo "::error::The app was still running after 90 s: it hangs at launch"
            sample $pid 3 -file sample.txt >/dev/null 2>&1
            kill -9 $pid
            echo "--- Python stacks ---"; cat trace.txt
            echo "--- native stack (main thread) ---"; sed -n '1,120p' sample.txt
            code=1
          else
            wait $pid; code=$?
          fi
          echo "exit code: $code"
          echo "--- self-test report ---"; cat self-test.txt 2>/dev/null
          echo "--- output ---"; cat launch.log
          [ "$code" = 0 ] || exit $code
          # Second launch: shows how much of the first one was macOS checking
          # the freshly built app.
          start=$(date +%s)
          "dist/IP Scanner.app/Contents/MacOS/IP Scanner" --self-test "$PWD/self-test2.txt"
          code=$?
          echo "second launch: $(( $(date +%s) - start )) s, exit $code"
          cat self-test2.txt
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: IP-Scanner-dmg
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # python.org builds for Windows include Tk 8.6.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build app
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm --log-level WARN packaging/ip_scanner.spec

      - name: Self-test the packaged app
        run: |
          $p = Start-Process -FilePath "dist\IP Scanner\IP Scanner.exe" `
                 -ArgumentList "--self-test", "$PWD\self-test.txt" -Wait -PassThru
          Get-Content self-test.txt
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Build installer
        run: |
          $version = python -c "import scanner; print(scanner.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc /Qp "/DAppVersion=$version" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Compress-Archive -Path "dist\IP Scanner" -DestinationPath "dist\IP-Scanner-Windows-Portable-$version.zip"
          Get-ChildItem dist -File

      - uses: actions/upload-artifact@v4
        with:
          name: IP-Scanner-windows
          path: |
            dist/IP-Scanner-Setup-*.exe
            dist/IP-Scanner-Windows-Portable-*.zip
          if-no-files-found: error

  # Opens the DMG on several macOS versions and launches the app normally
  # (not in self-test mode), to catch an app that starts but never shows.
  mac-launch:
    needs: dmg
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: IP-Scanner-dmg
      - name: Launch from the DMG
        run: |
          sw_vers
          hdiutil attach -nobrowse -mountpoint /tmp/ipscanner IP-Scanner-*.dmg >/dev/null
          APP="/tmp/ipscanner/IP Scanner.app"
          "$APP/Contents/MacOS/IP Scanner" --self-test "$PWD/self-test.txt"
          echo "self-test exit: $?"; cat self-test.txt
          IPSCANNER_TRACE="$PWD/trace.txt" "$APP/Contents/MacOS/IP Scanner" > app.log 2>&1 &
          pid=$!
          sleep 25
          if kill -0 $pid 2>/dev/null; then
            echo "App is running after 25 s (pid $pid)"
          else
            wait $pid; echo "::error::App exited early with code $?"
          fi
          echo "--- windows ---"
          windows=$(osascript -e "tell application \"System Events\" to get {name, position, size} of every window of (first process whose unix id is $pid)" 2>&1 || true)
          echo "$windows"
          screencapture -x screen.png 2>/dev/null || true
          echo "--- Python stacks after 20 s ---"; cat trace.txt
          echo "--- app output ---"; cat app.log
          kill $pid 2>/dev/null || true
          case "$windows" in
            "IP Scanner, "*) echo "The IP Scanner window is open." ;;
            *) echo "::error::No IP Scanner window after 25 s"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-${{ matrix.os }}
          path: screen.png
          if-no-files-found: ignore

  release:
    needs: [dmg, windows, mac-launch]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only the installers: the mac-launch jobs also upload screenshots.
      - uses: actions/download-artifact@v4
        with:
          pattern: IP-Scanner-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' scanner.py)
          TAG="v$VERSION"
          # v2.4.1 was published with a stray test screenshot; remove it.
          gh release delete-asset v2.4.1 screen.png -y 2>/dev/null || true
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            exit 0
          fi
          gh release create "$TAG" dist/*.dmg dist/*.exe dist/*.zip --target "$GITHUB_SHA" \
            --title "IP Scanner $VERSION" \
            --notes-file - <<NOTES
          **Mac:** download **IP-Scanner-$VERSION.dmg**, open it and drag IP Scanner to Applications. The first time, macOS blocks the app because it isn't notarized: open System Settings → Privacy & Security and click **Open Anyway**.

          **Windows 10/11:** download **IP-Scanner-Setup-$VERSION.exe** and run it (no admin rights needed). If Windows says it protected your PC, click **More info → Run anyway**: the installer isn't code-signed. The portable .zip runs without installing.

          See the README for details.
          NOTES
