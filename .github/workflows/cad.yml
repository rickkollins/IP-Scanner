# Tests and builds the Forge CAD web app (cad/) when it changes.
name: CAD

on:
  push:
    paths: ["cad/**", ".github/workflows/cad.yml"]
  pull_request:
    paths: ["cad/**", ".github/workflows/cad.yml"]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cad/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:single
      - uses: actions/upload-artifact@v4
        with:
          name: forge-cad
          path: cad/dist-single/index.html
          if-no-files-found: error
