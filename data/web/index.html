<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IP Scanner</title>
<meta name="theme-color" content="#2b8be0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1621" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root {
  --bg: #eaf3fc; --surface: #ffffff; --surface2: #f2f8fe; --border: #d6e6f5;
  --accent: #2b8be0; --accent-strong: #1d74c2; --accent-soft: #dcecfb; --on-accent: #ffffff;
  --text: #17283a; --muted: #5f7489; --alive: #21a35b; --danger: #d64545;
  --head-a: #3d9cf0; --head-b: #6cc0f8; --head-text: #ffffff;
  --shadow: 0 1px 2px rgba(23, 60, 100, .06), 0 6px 20px rgba(23, 60, 100, .07);
  --radius: 18px; --pill: 999px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0e1621; --surface: #152131; --surface2: #1b2a3d; --border: #263a52;
  --accent: #4fb3ff; --accent-strong: #6fc2ff; --accent-soft: #1d3a57; --on-accent: #04213b;
  --text: #e2ecf6; --muted: #8ea4ba; --alive: #3ddc84; --danger: #ff7b7b;
  --head-a: #123a63; --head-b: #1b5185; --head-text: #e6f3ff;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1621; --surface: #152131; --surface2: #1b2a3d; --border: #263a52;
    --accent: #4fb3ff; --accent-strong: #6fc2ff; --accent-soft: #1d3a57; --on-accent: #04213b;
    --text: #e2ecf6; --muted: #8ea4ba; --alive: #3ddc84; --danger: #ff7b7b;
    --head-a: #123a63; --head-b: #1b5185; --head-text: #e6f3ff;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
}
button, input, textarea { font: inherit; color: inherit; }
a { color: inherit; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }

/* App bar */
.appbar {
  background: linear-gradient(135deg, var(--head-a), var(--head-b));
  color: var(--head-text);
  padding: calc(14px + env(safe-area-inset-top)) 0 54px;
  border-radius: 0 0 28px 28px;
}
.appbar .wrap { display: flex; align-items: center; gap: 12px; }
.logo { width: 42px; height: 42px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.titles { flex: 1; min-width: 0; }
.titles h1 { margin: 0; font-size: 20px; line-height: 1.2; letter-spacing: -.01em; }
.titles p { margin: 2px 0 0; font-size: 13px; opacity: .9; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.icon-btn {
  width: 42px; height: 42px; border-radius: var(--pill); border: 0; cursor: pointer;
  display: grid; place-items: center; background: rgba(255,255,255,.22); color: inherit;
}
.icon-btn:hover { background: rgba(255,255,255,.32); }
.icon-btn svg { width: 20px; height: 20px; }

/* Summary + pill navigation */
.summary {
  margin-top: -38px; background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 14px; display: grid; gap: 12px;
}
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface2); border-radius: 14px; padding: 8px 10px; text-align: center; }
.stat b { display: block; font-size: 20px; line-height: 1.2; }
.stat span { font-size: 12px; color: var(--muted); }
.pills {
  display: flex; gap: 6px; padding: 5px; background: var(--surface2); border-radius: var(--pill);
  overflow-x: auto; scrollbar-width: none;
}
.pills::-webkit-scrollbar { display: none; }
.pill {
  flex: 1 0 auto; border: 0; background: transparent; color: var(--muted); cursor: pointer;
  padding: 9px 16px; border-radius: var(--pill); font-weight: 600; font-size: 14px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: background .15s, color .15s;
}
@media (max-width: 420px) { .pill { padding: 8px 10px; font-size: 13.5px; } }
.pill[aria-selected="true"] { background: var(--accent); color: var(--on-accent);
  box-shadow: 0 2px 8px rgba(43, 139, 224, .35); }
.pill .badge { background: var(--accent-soft); color: var(--accent-strong); border-radius: var(--pill);
  padding: 0 7px; font-size: 12px; line-height: 18px; }
.pill[aria-selected="true"] .badge { background: rgba(255,255,255,.25); color: inherit; }

/* Sections */
section { display: none; padding-top: 14px; }
section.active { display: block; }
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px; margin-bottom: 12px; }
.card h2 { font-size: 15px; margin: 0 0 10px; }
.hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }

/* Search + filter chips */
.toolbar { display: grid; gap: 10px; margin-bottom: 12px; }
.search { position: relative; }
.search svg { position: absolute; left: 14px; top: 50%; width: 18px; height: 18px;
  transform: translateY(-50%); color: var(--muted); }
.field {
  width: 100%; border: 1px solid var(--border); background: var(--surface);
  border-radius: var(--pill); padding: 11px 16px; outline: none;
}
.search .field { padding-left: 42px; }
textarea.field { border-radius: 14px; resize: vertical; min-height: 84px; }
.field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  padding: 6px 14px; border-radius: var(--pill); font-size: 13px; font-weight: 600;
  cursor: pointer; text-decoration: none; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent;
  color: var(--accent-strong); }

/* Device cards */
.list { display: grid; gap: 10px; }
@media (min-width: 760px) { .list { grid-template-columns: 1fr 1fr; align-items: start; } }
.device { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  overflow: hidden; }
.device-head {
  width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px;
  background: none; border: 0; text-align: left; cursor: pointer;
}
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--alive); flex: none;
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--alive) 18%, transparent); }
.who { flex: 1; min-width: 0; }
.name { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.count { flex: none; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: var(--pill);
  background: var(--accent-soft); color: var(--accent-strong); }
.count.none { background: var(--surface2); color: var(--muted); }
.chev { width: 18px; height: 18px; color: var(--muted); transition: transform .2s; flex: none; }
.device[open-card] .chev { transform: rotate(180deg); }
.device-body { display: none; padding: 0 16px 16px; }
.device[open-card] .device-body { display: block; }
.svc-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.svc { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
  border-radius: var(--pill); background: var(--accent-soft); color: var(--accent-strong);
  font-size: 13px; font-weight: 600; text-decoration: none; }
a.svc:hover { filter: brightness(.96); }
.svc small { opacity: .75; font-weight: 500; }
.svc svg { width: 13px; height: 13px; }
.details { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; margin: 0; }
.details dt { color: var(--muted); }
.details dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.empty { text-align: center; color: var(--muted); padding: 40px 16px; }
.empty svg { width: 48px; height: 48px; color: var(--accent); opacity: .6; }

/* Services */
.list > .card { margin-bottom: 0; }
.service-card .svc-chips { margin-bottom: 0; }
.service-card h3 { margin: 0 0 10px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.service-card h3 .count { margin-left: auto; }

/* Settings */
.row { display: flex; gap: 8px; }
.row .field { flex: 1; min-width: 0; }
.btn {
  border: 1px solid var(--border); background: var(--surface2); color: var(--text);
  border-radius: var(--pill); padding: 10px 16px; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  text-decoration: none; white-space: nowrap;
}
.btn:hover { background: var(--accent-soft); }
.btn svg { width: 18px; height: 18px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.switch { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; }
.switch input { position: absolute; opacity: 0; }
.track { flex: none; width: 46px; height: 28px; border-radius: var(--pill); background: var(--border);
  position: relative; transition: background .2s; margin-top: 1px; }
.track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px;
  border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left .2s; }
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { left: 21px; }
.switch input:focus-visible + .track { box-shadow: 0 0 0 3px var(--accent-soft); }

/* Bottom scan bar */
.scanbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.scanbar .wrap { display: flex; align-items: center; gap: 12px; padding: 0; }
.progress { flex: 1; min-width: 0; }
.progress .msg { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; margin-bottom: 6px; }
.bar { height: 8px; border-radius: var(--pill); background: var(--accent-soft); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--accent);
  transition: width .4s; }
.scan-btn {
  flex: none; border: 0; border-radius: var(--pill); padding: 14px 26px; min-width: 128px;
  background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
  box-shadow: 0 6px 18px rgba(43, 139, 224, .4);
}
.scan-btn:hover { background: var(--accent-strong); }
.scan-btn.stop { background: var(--danger); color: #fff; box-shadow: 0 6px 18px rgba(214, 69, 69, .35); }
.scan-btn svg { width: 18px; height: 18px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom));
  transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px;
  border-radius: var(--pill); font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none;
  max-width: calc(100% - 32px); }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor"/></symbol>
  <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z M14 3v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-radar" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 12 18.4 5.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></symbol>
</svg>

<header class="appbar">
  <div class="wrap">
    <img class="logo" src="/icon.png" alt="">
    <div class="titles">
      <h1>IP Scanner</h1>
      <p id="subtitle">Find every device on your network</p>
    </div>
    <button class="icon-btn" id="theme" type="button" aria-label="Switch to dark mode">
      <svg><use href="#i-moon"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <div class="summary">
    <div class="stats">
      <div class="stat"><b id="s-alive">0</b><span>Alive</span></div>
      <div class="stat"><b id="s-services">0</b><span>Open services</span></div>
      <div class="stat"><b id="s-scanned">0</b><span>Scanned</span></div>
    </div>
    <nav class="pills" role="tablist" aria-label="Sections">
      <button class="pill" role="tab" id="tab-devices" aria-controls="devices" aria-selected="true" data-tab="devices">Devices <span class="badge" id="b-devices">0</span></button>
      <button class="pill" role="tab" id="tab-services" aria-controls="services" aria-selected="false" data-tab="services">Services <span class="badge" id="b-services">0</span></button>
      <button class="pill" role="tab" id="tab-settings" aria-controls="settings" aria-selected="false" data-tab="settings">Settings</button>
    </nav>
  </div>

  <section id="devices" class="active" role="tabpanel" aria-labelledby="tab-devices">
    <div class="toolbar">
      <label class="search">
        <svg aria-hidden="true"><use href="#i-search"/></svg>
        <input class="field" id="q" type="search" placeholder="Search name, IP, maker, MAC or service" aria-label="Search devices">
      </label>
      <div class="chips" role="group" aria-label="Filter">
        <button class="chip" data-filter="all" aria-pressed="true" type="button">All</button>
        <button class="chip" data-filter="open" aria-pressed="false" type="button">Open ports</button>
        <button class="chip" data-filter="web" aria-pressed="false" type="button">Web pages</button>
        <button class="chip" data-filter="named" aria-pressed="false" type="button">Named</button>
      </div>
    </div>
    <div class="list" id="device-list"></div>
  </section>

  <section id="services" role="tabpanel" aria-labelledby="tab-services">
    <div class="list" id="service-list"></div>
  </section>

  <section id="settings" role="tabpanel" aria-labelledby="tab-settings">
    <div class="card">
      <h2>Network range</h2>
      <div class="row">
        <input class="field" id="range" inputmode="url" autocomplete="off" spellcheck="false" aria-label="IP range">
        <button class="btn" id="mynet" type="button">My network</button>
      </div>
      <p class="hint">Examples: 192.168.1.1-254 · 10.0.0.0/24 · 192.168.2.10</p>
    </div>
    <div class="card">
      <h2>Ports</h2>
      <textarea class="field" id="ports" spellcheck="false" aria-label="Ports"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn" id="defports" type="button">Restore defaults</button></div>
    </div>
    <div class="card">
      <label class="switch">
        <input type="checkbox" id="flush">
        <span class="track" aria-hidden="true"></span>
        <span><b>Clear ARP &amp; DNS cache first</b><br><span class="hint">Asks for an administrator password on the computer running IP Scanner, so only turn this on if you're at that computer.</span></span>
      </label>
    </div>
    <div class="card">
      <h2>Reports</h2>
      <div class="actions">
        <a class="btn" href="/report.pdf" target="_blank" rel="noopener"><svg><use href="#i-doc"/></svg>PDF report</a>
        <a class="btn" href="/export.csv"><svg><use href="#i-down"/></svg>Export CSV</a>
      </div>
      <p class="hint">The PDF is the printable landscape table, with every device's services.</p>
    </div>
    <p class="hint" style="text-align:center" id="about"></p>
  </section>
</main>

<div class="scanbar">
  <div class="wrap">
    <div class="progress">
      <div class="msg" id="msg" role="status" aria-live="polite">Ready.</div>
      <div class="bar" role="progressbar" aria-label="Scan progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="bar"></i></div>
    </div>
    <button class="scan-btn" id="scan" type="button"><svg><use href="#i-play"/></svg><span>Scan</span></button>
  </div>
</div>
<div class="toast" id="toast" role="alert"></div>

<script>
(() => {
  "use strict";
  // Drop the access key from the address bar; the server keeps it in a cookie.
  if (location.search.includes("t=")) history.replaceState(null, "", "/");

  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v; else n.setAttribute(k, v);
    }
    for (const k of kids.flat()) if (k !== null && k !== undefined) n.append(k);
    return n;
  };
  const icon = (name, cls) => {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    if (cls) s.setAttribute("class", cls);
    const u = document.createElementNS("http://www.w3.org/2000/svg", "use");
    u.setAttribute("href", "#i-" + name);
    s.setAttribute("aria-hidden", "true");
    s.append(u);
    return s;
  };

  // ---- theme ----
  const themeBtn = $("theme");
  const sysDark = window.matchMedia("(prefers-color-scheme: dark)");
  const isDark = () => (document.documentElement.dataset.theme || (sysDark.matches ? "dark" : "light")) === "dark";
  function paintThemeButton() {
    const dark = isDark();
    themeBtn.replaceChildren(icon(dark ? "sun" : "moon"));
    themeBtn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
  }
  const saved = store.get("ipscanner-theme");
  if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
  paintThemeButton();
  sysDark.addEventListener?.("change", paintThemeButton);
  themeBtn.addEventListener("click", () => {
    const next = isDark() ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    store.set("ipscanner-theme", next);
    paintThemeButton();
  });

  // ---- tabs (pill navigation) ----
  const tabs = [...document.querySelectorAll(".pill")];
  function showTab(name) {
    for (const t of tabs) {
      const on = t.dataset.tab === name;
      t.setAttribute("aria-selected", on);
      t.tabIndex = on ? 0 : -1;
      $(t.dataset.tab).classList.toggle("active", on);
    }
    store.set("ipscanner-tab", name);
  }
  tabs.forEach((t, i) => {
    t.addEventListener("click", () => showTab(t.dataset.tab));
    t.addEventListener("keydown", (e) => {
      const d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
      if (!d) return;
      const next = tabs[(i + d + tabs.length) % tabs.length];
      next.focus(); showTab(next.dataset.tab);
    });
  });
  showTab(store.get("ipscanner-tab") || "devices");

  // ---- filters ----
  let filter = "all";
  for (const c of document.querySelectorAll("[data-filter]")) {
    c.addEventListener("click", () => {
      filter = c.dataset.filter;
      document.querySelectorAll("[data-filter]").forEach((x) => x.setAttribute("aria-pressed", x === c));
      render();
    });
  }
  $("q").addEventListener("input", render);

  // ---- toast ----
  let toastTimer;
  function toast(text) {
    const t = $("toast");
    t.textContent = text; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
  }

  // ---- rendering ----
  let state = null;
  const openCards = new Set(JSON.parse(store.get("ipscanner-open") || "[]"));
  const isWeb = (s) => /^https?:/.test(s.url);

  function svcChip(s) {
    const label = [s.name.replace(/^Port \d+$/, "Port"), el("small", {}, String(s.port))];
    if (isWeb(s)) {
      return el("a", { class: "svc", href: s.url, target: "_blank", rel: "noopener noreferrer" },
        label, icon("ext"));
    }
    return el("span", { class: "svc", title: s.url || "" }, label);
  }

  function deviceCard(h) {
    const n = h.services.length;
    const open = openCards.has(h.ip);
    const head = el("button", { class: "device-head", type: "button", "aria-expanded": String(open) },
      el("span", { class: "dot", "aria-hidden": "true" }),
      el("div", { class: "who" },
        el("div", { class: "name" }, h.name || h.ip),
        el("div", { class: "meta" }, [h.name ? h.ip : null, h.vendor || null].filter(Boolean).join(" · ") || "Unknown device")),
      el("span", { class: "count" + (n ? "" : " none") }, n ? `${n} open` : "No ports"),
      icon("chev", "chev"));
    const body = el("div", { class: "device-body" },
      n ? el("div", { class: "svc-chips" }, h.services.map(svcChip)) : null,
      el("dl", { class: "details" },
        el("dt", {}, "IP address"), el("dd", {}, h.ip),
        el("dt", {}, "MAC address"), el("dd", {}, h.mac || "—"),
        el("dt", {}, "Manufacturer"), el("dd", {}, h.vendor || "—"),
        el("dt", {}, "Name"), el("dd", {}, h.name || "—")));
    const card = el("article", { class: "device", "open-card": open ? "" : null }, head, body);
    head.addEventListener("click", () => {
      const now = !card.hasAttribute("open-card");
      card.toggleAttribute("open-card", now);
      head.setAttribute("aria-expanded", String(now));
      now ? openCards.add(h.ip) : openCards.delete(h.ip);
      store.set("ipscanner-open", JSON.stringify([...openCards]));
    });
    return card;
  }

  function matches(h, q) {
    if (filter === "open" && !h.services.length) return false;
    if (filter === "web" && !h.services.some(isWeb)) return false;
    if (filter === "named" && !h.name) return false;
    if (!q) return true;
    const hay = [h.ip, h.name, h.vendor, h.mac, ...h.services.map((s) => `${s.name} ${s.port}`)]
      .join(" ").toLowerCase();
    return q.split(/\s+/).every((w) => hay.includes(w));
  }

  function emptyState(title, text) {
    return el("div", { class: "empty card" }, icon("radar"), el("h2", {}, title), el("p", { class: "hint" }, text));
  }

  function render() {
    if (!state) return;
    const hosts = state.hosts;
    const q = $("q").value.trim().toLowerCase();
    const shown = hosts.filter((h) => matches(h, q));
    const list = $("device-list");
    if (!hosts.length) {
      list.replaceChildren(emptyState(state.scanning ? "Looking for devices…" : "No devices yet",
        state.scanning ? "Devices appear here as they answer." : "Tap Scan to search your network."));
    } else if (!shown.length) {
      list.replaceChildren(emptyState("No matches", "Try another search or filter."));
    } else {
      list.replaceChildren(...shown.map(deviceCard));
    }

    // Services, grouped by port.
    const byPort = new Map();
    for (const h of hosts) for (const s of h.services) {
      if (!byPort.has(s.port)) byPort.set(s.port, { name: s.name, items: [] });
      byPort.get(s.port).items.push({ h, s });
    }
    const ports = [...byPort.keys()].sort((a, b) => byPort.get(b).items.length - byPort.get(a).items.length || a - b);
    $("service-list").replaceChildren(...(ports.length ? ports.map((p) => {
      const g = byPort.get(p);
      return el("div", { class: "card service-card" },
        el("h3", {}, g.name, el("span", { class: "meta" }, `port ${p}`),
          el("span", { class: "count" }, `${g.items.length} device${g.items.length === 1 ? "" : "s"}`)),
        el("div", { class: "svc-chips" }, g.items.map(({ h, s }) => isWeb(s)
          ? el("a", { class: "svc", href: s.url, target: "_blank", rel: "noopener noreferrer" }, h.name || h.ip, icon("ext"))
          : el("span", { class: "svc", title: s.url }, h.name || h.ip))));
    }) : [emptyState("No open services yet", "Open ports found on devices are listed here, grouped by service.")]));

    const services = hosts.reduce((n, h) => n + h.services.length, 0);
    $("s-alive").textContent = hosts.length;
    $("s-services").textContent = services;
    $("s-scanned").textContent = state.total;
    $("b-devices").textContent = hosts.length;
    $("b-services").textContent = ports.length;
  }

  function paintProgress() {
    $("msg").textContent = state.message;
    $("bar").style.width = state.percent + "%";
    document.querySelector(".bar").setAttribute("aria-valuenow", Math.round(state.percent));
    const btn = $("scan");
    btn.classList.toggle("stop", state.scanning);
    btn.replaceChildren(icon(state.scanning ? "stop" : "play"), el("span", {}, state.scanning ? "Stop" : "Scan"));
    $("subtitle").textContent = state.scanned ? `Network ${state.scanned}` : "Find every device on your network";
  }

  // ---- settings ----
  let settingsLoaded = false;
  function loadSettings() {
    if (settingsLoaded || !state) return;
    settingsLoaded = true;
    $("range").value = store.get("ipscanner-range") || state.default_range;
    $("ports").value = store.get("ipscanner-ports") || state.default_ports;
    $("flush").checked = store.get("ipscanner-flush") === "1";
    $("about").textContent = `IP Scanner ${state.version} · running on this network's computer`;
  }
  $("mynet").addEventListener("click", () => { $("range").value = state?.default_range || ""; store.set("ipscanner-range", ""); });
  $("defports").addEventListener("click", () => { $("ports").value = state?.default_ports || ""; store.set("ipscanner-ports", ""); });
  $("range").addEventListener("change", () => store.set("ipscanner-range", $("range").value));
  $("ports").addEventListener("change", () => store.set("ipscanner-ports", $("ports").value));
  $("flush").addEventListener("change", () => store.set("ipscanner-flush", $("flush").checked ? "1" : "0"));

  // ---- server ----
  async function api(path, body) {
    const r = await fetch(path, body === undefined ? { cache: "no-store" } : {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    if (r.status === 403) throw new Error("This link has expired. Open the link from the IP Scanner app again.");
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Something went wrong.");
    return data;
  }

  let timer;
  async function poll() {
    clearTimeout(timer);
    try {
      state = await api("/api/state");
      loadSettings(); paintProgress(); render();
    } catch (e) {
      $("msg").textContent = e.message.includes("fetch") ? "Can't reach the computer running IP Scanner." : e.message;
    }
    timer = setTimeout(poll, state?.scanning ? 800 : 4000);
  }

  $("scan").addEventListener("click", async () => {
    try {
      if (state?.scanning) { await api("/api/stop", {}); }
      else {
        await api("/api/scan", { range: $("range").value.trim(), ports: $("ports").value, flush: $("flush").checked });
        if (store.get("ipscanner-tab") === "settings") showTab("devices");
      }
    } catch (e) { toast(e.message); }
    poll();
  });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
  poll();
})();
</script>
</body>
</html>
